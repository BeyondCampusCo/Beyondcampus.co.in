<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beyond Campus | Student Travel & Experiences</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit',sans-serif;
scroll-behavior:smooth;
}

body{
background:#08131F;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:700px;
height:700px;
background:#00D4FF22;
filter:blur(120px);
top:-220px;
right:-180px;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:500px;
height:500px;
background:#5B5BFF22;
filter:blur(130px);
bottom:-180px;
left:-150px;
z-index:-1;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 8%;
background:rgba(8,19,31,.75);
backdrop-filter:blur(16px);
z-index:1000;
}

.logo{
font-size:30px;
font-weight:800;
color:#00D4FF;
}

nav ul{
display:flex;
list-style:none;
gap:35px;
}

nav a{
text-decoration:none;
color:white;
font-weight:500;
transition:.3s;
}

nav a:hover{
color:#00D4FF;
}

.hero{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:120px 20px;

}

.hero h1{

font-size:72px;

font-weight:800;

line-height:1.1;

margin-bottom:20px;

}

.hero p{

font-size:22px;

color:#c8d7e4;

max-width:700px;

margin:auto;

line-height:1.7;

}

.btn{

display:inline-block;

margin-top:45px;

padding:18px 42px;

border-radius:50px;

text-decoration:none;

font-size:18px;

font-weight:700;

background:#00D4FF;

color:#08131F;

transition:.35s;

}

.btn:hover{

transform:translateY(-6px);

box-shadow:0 0 30px #00D4FF88;

}

.scroll{

margin-top:70px;

font-size:15px;

color:#8ca5bc;

letter-spacing:2px;

}

@media(max-width:900px){

.hero h1{

font-size:46px;

}

.hero p{

font-size:18px;

}

nav{

padding:20px;

}

nav ul{

gap:18px;

font-size:14px;

}

.logo{

font-size:24px;

}

}

</style>

</head>

<body>

<nav>

<div class="logo">Beyond Campus</div>

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">Trips</a></li>

<li><a href="#">Gallery</a></li>

<li><a href="#">About</a></li>

<li><a href="#">Contact</a></li>

</ul>

</nav>

<section class="hero">

<div>

<h1>Journeys Beyond<br>Classrooms</h1>

<p>

India's next generation student travel platform.

Explore adventures, build friendships,

and create unforgettable memories with Beyond Campus.

</p>

<a href="#" class="btn">Explore Trips</a>

<div class="scroll">

SCROLL TO EXPLORE ↓

</div>

</div>

</section>

</body>
</html>
