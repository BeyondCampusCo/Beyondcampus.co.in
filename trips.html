<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trips | Beyond Campus</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(180deg,#08131F,#10294A);
color:#fff;
min-height:100vh;
}

header{
padding:25px;
text-align:center;
font-size:34px;
font-weight:700;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
color:white;
text-decoration:none;
font-weight:700;
font-size:34px;
transition:.3s;
}

.logo:hover{
color:#00D4FF;
}

.container{
max-width:1000px;
margin:auto;
padding:70px 20px;
}

h1{
font-size:48px;
text-align:center;
margin-bottom:15px;
}

.subtitle{
text-align:center;
color:#bfc8d3;
margin-bottom:60px;
}

.trip-card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:35px;
transition:.35s;
cursor:pointer;
text-decoration:none;
display:block;
color:white;
}

.trip-card:hover{
transform:translateY(-8px);
border-color:#00D4FF;
box-shadow:0 15px 40px rgba(0,212,255,.18);
}

.trip-card h2{
font-size:32px;
margin-bottom:10px;
}

.trip-card p{
color:#d2dae3;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:14px 30px;
background:#00D4FF;
border-radius:50px;
color:#08131F;
font-weight:700;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<a href="index.html" class="logo">
BeyondCampus.co
</a>

</header>

<div class="container">

<h1>Available Trips</h1>

<p class="subtitle">
Choose your next adventure.
</p>

<a href="waterpark.html" class="trip-card">

<h2>🌊 Water Park Trip</h2>

<p>
Exclusive trip for SLIETians.
</p>

<span class="btn">
View Details →
</span>

</a>

</div>

</body>
</html>
